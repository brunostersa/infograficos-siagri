<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Distribuidor de Insumos</title>
  <style>
    :root {
      --green: #00b232;
      --lime:  #a5c715;
      --text:  #2a2b2b;
      --bg:    #f5f5f5;
      --breakpoint: 1024px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { background: var(--bg); height: 100%; }

    /* ═══════════════════════════════════════════
       NAV FLUTUANTE
    ═══════════════════════════════════════════ */
    #infog-nav {
      position: fixed;
      top: 14px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;
      background: #fff;
      border: 1.5px solid #e0e0e0;
      border-radius: 8px;
      box-shadow: 0 4px 16px rgba(0,0,0,.12);
      padding: 6px 12px 6px 10px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: 'Halcom', Arial, sans-serif;
      font-size: 12px;
      color: #2a2b2b;
      white-space: nowrap;
    }
    #infog-nav::before {
      content: '';
      display: inline-block;
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--green);
      flex-shrink: 0;
    }
    #infog-nav select {
      border: none; outline: none;
      font-family: inherit; font-size: 12px; font-weight: 700;
      color: #2a2b2b; background: transparent;
      cursor: pointer; padding-right: 4px;
    }

    /* ═══════════════════════════════════════════
       DESKTOP — layout isométrico (≥ 1024px)
    ═══════════════════════════════════════════ */
    #iso-view  { display: block; }
    #card-view { display: none; }

    body.desktop { overflow: hidden; }
    body.desktop html { overflow: hidden; }

    #scale-container { width: 100%; overflow: hidden; }

    #infografico {
      position: relative;
      width: 1920px;
      height: 1080px;
      background: var(--bg);
      transform-origin: top left;
    }

    .layer {
      position: absolute;
      pointer-events: none;
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 0.55s ease-out, transform 0.55s ease-out;
    }
    .layer.visible { opacity: 1; transform: translateY(0); }
    .layer img { display: block; width: 100%; height: 100%; }

    .layer[data-id="bg"] {
      left: 447px; top: 317px; width: 1042px; height: 548px;
      transform: none;
      clip-path: circle(0% at 50% 50%);
      transition: opacity 0.4s ease-out, clip-path 0.9s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .layer[data-id="bg"].visible { transform: none; clip-path: circle(150% at 50% 50%); }

    .layer[data-id="parcerias"]   { left: 431px;  top:  56px;  width: 534px; height: 378px; }
    .layer[data-id="credito"]     { left: 758px;  top: 269px;  width: 439px; height: 304px; }
    .layer[data-id="estoque"]     { left: 1091px; top: 337px;  width: 595px; height: 389px; }
    .layer[data-id="acesso"]      { left: 209px;  top: 460px;  width: 557px; height: 252px; }
    .layer[data-id="venda"]       { left: 519px;  top: 650px;  width: 566px; height: 391px; }
    .layer[data-id="performance"] { left: 1146px; top: 632px;  width: 658px; height: 433px; }

    .hotspot {
      position: absolute; cursor: pointer;
      border-radius: 8px; z-index: 20;
    }
    .hotspot[data-id="parcerias"]   { left: 431px;  top:  56px;  width: 534px; height: 378px; }
    .hotspot[data-id="credito"]     { left: 758px;  top: 269px;  width: 439px; height: 304px; }
    .hotspot[data-id="estoque"]     { left: 1091px; top: 337px;  width: 595px; height: 389px; }
    .hotspot[data-id="acesso"]      { left: 209px;  top: 460px;  width: 557px; height: 252px; }
    .hotspot[data-id="venda"]       { left: 519px;  top: 650px;  width: 566px; height: 391px; }
    .hotspot[data-id="performance"] { left: 1146px; top: 632px;  width: 658px; height: 433px; }

    .hotspot::before {
      content: ''; position: absolute; inset: 0;
      border-radius: 8px; background: rgba(0,178,50,0);
      transition: background 0.25s ease;
    }
    .hotspot:hover::before { background: rgba(0,178,50,0.08); }

    /* Tooltip desktop */
    #tooltip {
      position: fixed; background: #fff;
      border-left: 4px solid var(--green);
      border-radius: 8px;
      box-shadow: 0 8px 32px rgba(0,0,0,.18);
      padding: 16px 20px; width: 240px;
      pointer-events: none; opacity: 0;
      transform: translateY(6px);
      transition: opacity 0.2s ease, transform 0.2s ease;
      z-index: 1000;
    }
    #tooltip.visible { opacity: 1; transform: translateY(0); }
    #tooltip::after {
      content: ''; position: absolute; left: 50%;
      transform: translateX(-50%); border: 8px solid transparent;
    }
    #tooltip[data-dir="above"]::after, #tooltip:not([data-dir])::after { top: 100%; border-top-color: #fff; }
    #tooltip[data-dir="below"]::after { bottom: 100%; border-bottom-color: #fff; }
    #tooltip h4 {
      font-family: 'Halcom', 'Arial Black', sans-serif;
      font-weight: 900; font-size: 13px; color: var(--green);
      text-transform: uppercase; letter-spacing: 0.04em;
      margin-bottom: 10px; line-height: 1.3;
    }
    #tooltip ul { list-style: none; padding: 0; }
    #tooltip ul li {
      font-family: 'Halcom', Arial, sans-serif;
      font-size: 12px; color: var(--text); line-height: 1.5;
      padding: 4px 0 4px 14px; position: relative;
      border-bottom: 1px solid rgba(0,0,0,0.06);
    }
    #tooltip ul li:last-child { border-bottom: none; }
    #tooltip ul li::before {
      content: ''; position: absolute; left: 0; top: 50%;
      transform: translateY(-50%); width: 6px; height: 6px;
      border-radius: 50%; background: var(--lime);
    }

    /* ═══════════════════════════════════════════
       MOBILE / TABLET — card grid (< 1024px)
    ═══════════════════════════════════════════ */
    #card-view {
      padding: 72px 16px 32px; /* 72px = nav height + gap */
      max-width: 900px;
      margin: 0 auto;
    }

    .card-grid {
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    .card {
      background: #fff;
      overflow: hidden;
      opacity: 0;
      transform: translateY(16px);
      transition: opacity 0.45s ease-out, transform 0.45s ease-out;
      border-bottom: 1px solid rgba(0,0,0,0.08);
    }
    .card:first-child { border-radius: 12px 12px 0 0; }
    .card:last-child  { border-radius: 0 0 12px 12px; border-bottom: none; }
    .card.visible { opacity: 1; transform: translateY(0); }

    .card-header {
      padding: 16px 20px 14px;
      border-bottom: 2px solid var(--green);
      display: flex;
      align-items: center;
      gap: 10px;
      background: #fff;
    }
    .card-header::before {
      content: '';
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--lime);
      flex-shrink: 0;
    }
    .card-header h3 {
      font-family: 'Halcom', 'Arial Black', sans-serif;
      font-weight: 900; font-size: 12px;
      color: var(--green); text-transform: uppercase;
      letter-spacing: 0.06em; line-height: 1.3;
    }

    .card-img {
      width: 100%;
      display: block;
      background: var(--bg);
      padding: 0;
      max-height: 260px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card-img img {
      width: 100%; height: auto; display: block;
      object-fit: cover;
    }

    .card-items {
      padding: 12px 20px 16px;
      list-style: none;
      background: #fff;
    }
    .card-items li {
      font-family: 'Halcom', Arial, sans-serif;
      font-size: 13px; color: var(--text); line-height: 1.5;
      padding: 7px 0 7px 16px; position: relative;
      border-bottom: 1px solid rgba(0,0,0,0.05);
    }
    .card-items li:last-child { border-bottom: none; }
    .card-items li::before {
      content: ''; position: absolute; left: 0; top: 50%;
      transform: translateY(-50%); width: 6px; height: 6px;
      border-radius: 50%; background: var(--lime);
    }

    /* ═══════════════════════════════════════════
       MEDIA QUERY — activa card view
    ═══════════════════════════════════════════ */
    @media (max-width: 1023px) {
      #iso-view  { display: none; }
      #card-view { display: block; }
      html, body  { overflow: auto; height: auto; }
    }
  </style>
</head>
<body>

<!-- NAV -->
<div id="infog-nav">
  <select id="infog-select" autocomplete="off">
    <option value="/distribuidor-de-insumos/">Distribuidor de Insumos</option>
    <option value="/loja-agropecuaria/">Loja Agropecuária</option>
    <option value="/originacao-comercio-de-graos/">Originação &amp; Comércio de Grãos</option>
    <option value="/agroindustria/">Agroindústria</option>
    <option value="/produtor-rural/">Produtor Rural</option>
  </select>
</div>

<!-- TOOLTIP (desktop only) -->
<div id="tooltip">
  <h4 id="tooltip-title"></h4>
  <ul id="tooltip-list"></ul>
</div>

<!-- ── ISO VIEW (desktop) ── -->
<div id="iso-view">
  <div id="scale-container">
  <div id="infografico">

    <div class="layer" data-id="bg" data-delay="1200"><img src="bg-lines.png" alt=""></div>

    <div class="layer" data-id="parcerias"   data-delay="0"   ><img src="parcerias-portfolio.png" alt=""></div>
    <div class="layer" data-id="credito"     data-delay="200" ><img src="credito.png" alt=""></div>
    <div class="layer" data-id="estoque"     data-delay="400" ><img src="estoque-logistica.png" alt=""></div>
    <div class="layer" data-id="acesso"      data-delay="600" ><img src="acesso-ao-produtor.png" alt=""></div>
    <div class="layer" data-id="venda"       data-delay="800" ><img src="venda-consultiva.png" alt=""></div>
    <div class="layer" data-id="performance" data-delay="1000"><img src="perfomance.png" alt=""></div>

    <div class="hotspot" data-id="parcerias"
      data-title="Parcerias &amp; Portifólio"
      data-items="Lorem ipsum dolor sit amet|Lorem ipsum dolor sit amet|Lorem ipsum dolor sit amet">
    </div>
    <div class="hotspot" data-id="credito"
      data-title="Crédito"
      data-items="Lorem ipsum dolor sit amet|Lorem ipsum dolor sit amet|Lorem ipsum dolor sit amet">
    </div>
    <div class="hotspot" data-id="estoque"
      data-title="Estoque &amp; Logística"
      data-items="Lorem ipsum dolor sit amet|Lorem ipsum dolor sit amet|Lorem ipsum dolor sit amet">
    </div>
    <div class="hotspot" data-id="acesso"
      data-title="Acesso ao Produtor"
      data-items="Lorem ipsum dolor sit amet|Lorem ipsum dolor sit amet|Lorem ipsum dolor sit amet">
    </div>
    <div class="hotspot" data-id="venda"
      data-title="Venda Consultiva"
      data-items="Lorem ipsum dolor sit amet|Lorem ipsum dolor sit amet|Lorem ipsum dolor sit amet">
    </div>
    <div class="hotspot" data-id="performance"
      data-title="Performance &amp; Resultados"
      data-items="Lorem ipsum dolor sit amet|Lorem ipsum dolor sit amet|Lorem ipsum dolor sit amet">
    </div>

  </div>
  </div>
</div>

<!-- ── CARD VIEW (mobile/tablet) ── -->
<div id="card-view">
  <div class="card-grid" id="card-grid">
    <!-- Cards gerados pelo JS -->
  </div>
</div>

<script>
(function () {

  /* ── Dados dos módulos ── */
  var modules = [
    {
      id: 'parcerias',
      title: 'Parcerias &amp; Portifólio',
      img: 'parcerias-portfolio.png',
      items: ['Lorem ipsum dolor sit amet', 'Lorem ipsum dolor sit amet', 'Lorem ipsum dolor sit amet']
    },
    {
      id: 'credito',
      title: 'Crédito',
      img: 'credito.png',
      items: ['Lorem ipsum dolor sit amet', 'Lorem ipsum dolor sit amet', 'Lorem ipsum dolor sit amet']
    },
    {
      id: 'estoque',
      title: 'Estoque &amp; Logística',
      img: 'estoque-logistica.png',
      items: ['Lorem ipsum dolor sit amet', 'Lorem ipsum dolor sit amet', 'Lorem ipsum dolor sit amet']
    },
    {
      id: 'acesso',
      title: 'Acesso ao Produtor',
      img: 'acesso-ao-produtor.png',
      items: ['Lorem ipsum dolor sit amet', 'Lorem ipsum dolor sit amet', 'Lorem ipsum dolor sit amet']
    },
    {
      id: 'venda',
      title: 'Venda Consultiva',
      img: 'venda-consultiva.png',
      items: ['Lorem ipsum dolor sit amet', 'Lorem ipsum dolor sit amet', 'Lorem ipsum dolor sit amet']
    },
    {
      id: 'performance',
      title: 'Performance &amp; Resultados',
      img: 'perfomance.png',
      items: ['Lorem ipsum dolor sit amet', 'Lorem ipsum dolor sit amet', 'Lorem ipsum dolor sit amet']
    }
  ];

  /* ── Build card grid ── */
  var grid = document.getElementById('card-grid');
  modules.forEach(function (mod, idx) {
    var card = document.createElement('div');
    card.className = 'card';
    card.dataset.id    = mod.id;
    card.dataset.delay = idx * 100;

    var itemsHTML = mod.items.map(function (t) {
      return '<li>' + t + '</li>';
    }).join('');

    card.innerHTML =
      '<div class="card-header"><h3>' + mod.title + '</h3></div>' +
      '<div class="card-img"><img src="' + mod.img + '" alt="' + mod.title + '" loading="lazy"></div>' +
      '<ul class="card-items">' + itemsHTML + '</ul>';

    grid.appendChild(card);
  });

  /* ── Animate cards in ── */
  function animateCards() {
    var cards = grid.querySelectorAll('.card');
    cards.forEach(function (card) {
      var delay = parseInt(card.dataset.delay || 0, 10) + 100;
      setTimeout(function () { card.classList.add('visible'); }, delay);
    });
  }

  /* ── Desktop iso view ── */
  var container = document.getElementById('scale-container');
  var wrapper   = document.getElementById('infografico');
  var layers    = wrapper ? wrapper.querySelectorAll('.layer') : [];
  var tooltip   = document.getElementById('tooltip');
  var ttTitle   = document.getElementById('tooltip-title');
  var ttList    = document.getElementById('tooltip-list');

  function applyScale() {
    if (!wrapper) return;
    var scale = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    var left  = Math.round((window.innerWidth - 1920 * scale) / 2);
    wrapper.style.transform  = 'scale(' + scale + ')';
    wrapper.style.marginLeft = left + 'px';
    container.style.height   = Math.round(1080 * scale) + 'px';
  }
  window.addEventListener('resize', applyScale);
  applyScale();

  function animateLayers() {
    layers.forEach(function (layer) {
      var delay = parseInt(layer.dataset.delay || 0, 10) + 200;
      setTimeout(function () { layer.classList.add('visible'); }, delay);
    });
  }

  /* ── Init on load ── */
  function init() {
    var isDesktop = window.matchMedia('(min-width: 1024px)').matches;
    if (isDesktop) {
      animateLayers();
    } else {
      animateCards();
    }
  }

  if (document.readyState === 'complete') {
    setTimeout(init, 80);
  } else {
    window.addEventListener('load', function () { setTimeout(init, 80); });
  }

  /* ── Tooltip (desktop) ── */
  if (wrapper) {
    wrapper.querySelectorAll('.hotspot').forEach(function (hs) {
      hs.addEventListener('mouseenter', function () {
        var rect = hs.getBoundingClientRect();
        ttTitle.innerHTML = hs.dataset.title;
        ttList.innerHTML  = '';
        hs.dataset.items.split('|').forEach(function (item) {
          var li = document.createElement('li');
          li.textContent = item;
          ttList.appendChild(li);
        });
        tooltip.classList.add('visible');
        var cx    = rect.left + rect.width / 2;
        var midY  = rect.top + rect.height * 0.45;
        var ttH   = tooltip.offsetHeight;
        var ttW   = tooltip.offsetWidth;
        var above = midY - ttH - 14;
        var below = midY + 14;
        var top   = above >= 8 ? above : below;
        tooltip.dataset.dir = above >= 8 ? 'above' : 'below';
        var left = cx - ttW / 2;
        left = Math.max(8, Math.min(left, window.innerWidth - ttW - 8));
        tooltip.style.left = left + 'px';
        tooltip.style.top  = top  + 'px';
      });
      hs.addEventListener('mouseleave', function () {
        tooltip.classList.remove('visible');
      });
    });
  }

  /* ── Nav select ── */
  (function () {
    var sel = document.getElementById('infog-select');
    var path = window.location.pathname;
    for (var i = 0; i < sel.options.length; i++) {
      var folder = sel.options[i].value.replace(/\//g, '');
      if (path.indexOf('/' + folder + '/') !== -1) { sel.selectedIndex = i; break; }
    }
    sel.addEventListener('change', function () {
      var folder = sel.value.replace(/\//g, '');
      window.location.href = '../' + folder + '/';
    });
  })();

})();
</script>

</body>
</html>
