<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Originação & Comércio de Grãos</title>
  <style>
    :root {
      --green: #00b232;
      --lime:  #a5c715;
      --text:  #2a2b2b;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { background: #f5f5f5; overflow: hidden; height: 100%; }

    #scale-container { width: 100%; overflow: hidden; }

    #infografico {
      position: relative;
      width: 1920px;
      height: 1080px;
      background: #f5f5f5;
      transform-origin: top left;
    }

    /* ── Camadas ── */
    .layer {
      position: absolute;
      pointer-events: none;
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 0.55s ease-out, transform 0.55s ease-out;
    }
    .layer.visible { opacity: 1; transform: translateY(0); }
    .layer img { display: block; width: 100%; height: 100%; }

    /* bg-lines: reveal radial do centro para fora */
    .layer[data-id="bg"] {
      left: 479px; top: 304px; width: 1032px; height: 545px;
      transform: none;
      clip-path: circle(0% at 50% 50%);
      transition: opacity 0.4s ease-out, clip-path 0.9s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .layer[data-id="bg"].visible {
      transform: none;
      clip-path: circle(150% at 50% 50%);
    }

    /* Coordenadas absolutas Figma 1920×1080 */
    .layer[data-id="recepcao"]    { left: 463px;  top:  94px; width: 495px; height: 326px; }
    .layer[data-id="armazenagem"] { left: 787px;  top: 162px; width: 630px; height: 386px; }
    .layer[data-id="logistica"]   { left: 1117px; top: 374px; width: 517px; height: 325px; }
    .layer[data-id="padronizacao"]{ left: 187px;  top: 485px; width: 608px; height: 231px; }
    .layer[data-id="contratos"]   { left: 552px;  top: 648px; width: 537px; height: 325px; }
    .layer[data-id="industria"]   { left: 1171px; top: 636px; width: 675px; height: 408px; }

    /* ── Hotspots ── */
    .hotspot {
      position: absolute;
      cursor: pointer;
      border-radius: 8px;
      z-index: 20;
    }

    .hotspot[data-id="recepcao"]    { left: 463px;  top:  94px; width: 495px; height: 326px; }
    .hotspot[data-id="armazenagem"] { left: 787px;  top: 162px; width: 630px; height: 386px; }
    .hotspot[data-id="logistica"]   { left: 1117px; top: 374px; width: 517px; height: 325px; }
    .hotspot[data-id="padronizacao"]{ left: 187px;  top: 485px; width: 608px; height: 231px; }
    .hotspot[data-id="contratos"]   { left: 552px;  top: 648px; width: 537px; height: 325px; }
    .hotspot[data-id="industria"]   { left: 1171px; top: 636px; width: 675px; height: 408px; }

    .hotspot::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 8px;
      background: rgba(0, 178, 50, 0);
      transition: background 0.25s ease;
    }
    .hotspot:hover::before { background: rgba(0, 178, 50, 0.08); }

    /* ── Tooltip global ── */
    #tooltip {
      position: fixed;
      background: #fff;
      border-left: 4px solid var(--green);
      border-radius: 8px;
      box-shadow: 0 8px 32px rgba(0,0,0,.18);
      padding: 16px 20px;
      width: 240px;
      pointer-events: none;
      opacity: 0;
      transform: translateY(6px);
      transition: opacity 0.2s ease, transform 0.2s ease;
      z-index: 1000;
    }
    #tooltip.visible { opacity: 1; transform: translateY(0); }
    #tooltip::after {
      content: '';
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      border: 8px solid transparent;
    }
    #tooltip[data-dir="above"]::after, #tooltip:not([data-dir])::after {
      top: 100%;
      border-top-color: #fff;
    }
    #tooltip[data-dir="below"]::after {
      bottom: 100%;
      border-bottom-color: #fff;
    }
    #tooltip h4 {
      font-family: 'Halcom', 'Arial Black', 'Arial Bold', sans-serif;
      font-weight: 900;
      font-size: 13px;
      color: var(--green);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 10px;
      line-height: 1.3;
    }
    #tooltip ul { list-style: none; padding: 0; }
    #tooltip ul li {
      font-family: 'Halcom', Arial, sans-serif;
      font-size: 12px;
      color: var(--text);
      line-height: 1.5;
      padding: 4px 0 4px 14px;
      position: relative;
      border-bottom: 1px solid rgba(0,0,0,0.06);
    }
    #tooltip ul li:last-child { border-bottom: none; }
    #tooltip ul li::before {
      content: '';
      position: absolute;
      left: 0; top: 50%;
      transform: translateY(-50%);
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--lime);
    }

    /* ── Nav flutuante ── */
    #infog-nav {
      position: fixed;
      top: 14px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;
      background: #fff;
      border: 1.5px solid #e0e0e0;
      border-radius: 8px;
      box-shadow: 0 4px 16px rgba(0,0,0,.12);
      padding: 6px 12px 6px 10px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: 'Halcom', Arial, sans-serif;
      font-size: 12px;
      color: #2a2b2b;
    }
    #infog-nav::before {
      content: '';
      display: inline-block;
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #00b232;
      flex-shrink: 0;
    }
    #infog-nav select {
      border: none;
      outline: none;
      font-family: inherit;
      font-size: 12px;
      font-weight: 700;
      color: #2a2b2b;
      background: transparent;
      cursor: pointer;
      padding-right: 4px;
    }
  </style>
</head>
<body>

<div id="infog-nav">
  <select id="infog-select">
    <option value="/distribuidor-de-insumos/">Distribuidor de Insumos</option>
    <option value="/loja-agropecuaria/">Loja Agropecuária</option>
    <option value="/originacao-comercio-de-graos/">Originação &amp; Comércio de Grãos</option>
    <option value="/agroindustria/">Agroindústria</option>
  </select>
</div>

<div id="tooltip">
  <h4 id="tooltip-title"></h4>
  <ul id="tooltip-list"></ul>
</div>

<div id="scale-container">
<div id="infografico">

  <div class="layer" data-id="bg" data-delay="0"><img src="bg-lines.png" alt=""></div>

  <div class="layer" data-id="recepcao"     data-delay="200"><img src="recepcao.png" alt=""></div>
  <div class="layer" data-id="armazenagem"  data-delay="400"><img src="armazenagem.png" alt=""></div>
  <div class="layer" data-id="logistica"    data-delay="600"><img src="logistica.png" alt=""></div>
  <div class="layer" data-id="padronizacao" data-delay="600"><img src="padronizacao.png" alt=""></div>
  <div class="layer" data-id="contratos"    data-delay="800"><img src="contratos.png" alt=""></div>
  <div class="layer" data-id="industria"    data-delay="1000"><img src="industria.png" alt=""></div>

  <!-- HOTSPOT: Recepção -->
  <div class="hotspot" data-id="recepcao"
    data-title="Recepção"
    data-items="Lorem ipsum dolor sit amet|Lorem ipsum dolor sit amet|Lorem ipsum dolor sit amet">
  </div>

  <!-- HOTSPOT: Armazenagem -->
  <div class="hotspot" data-id="armazenagem"
    data-title="Armazenagem"
    data-items="Lorem ipsum dolor sit amet|Lorem ipsum dolor sit amet|Lorem ipsum dolor sit amet">
  </div>

  <!-- HOTSPOT: Logística -->
  <div class="hotspot" data-id="logistica"
    data-title="Logística"
    data-items="Lorem ipsum dolor sit amet|Lorem ipsum dolor sit amet|Lorem ipsum dolor sit amet">
  </div>

  <!-- HOTSPOT: Padronização -->
  <div class="hotspot" data-id="padronizacao"
    data-title="Padronização"
    data-items="Lorem ipsum dolor sit amet|Lorem ipsum dolor sit amet|Lorem ipsum dolor sit amet">
  </div>

  <!-- HOTSPOT: Contratos -->
  <div class="hotspot" data-id="contratos"
    data-title="Contratos"
    data-items="Lorem ipsum dolor sit amet|Lorem ipsum dolor sit amet|Lorem ipsum dolor sit amet">
  </div>

  <!-- HOTSPOT: Indústria -->
  <div class="hotspot" data-id="industria"
    data-title="Indústria"
    data-items="Lorem ipsum dolor sit amet|Lorem ipsum dolor sit amet|Lorem ipsum dolor sit amet">
  </div>

</div>
</div>

<script>
  (function () {
    var container = document.getElementById('scale-container');
    var wrapper   = document.getElementById('infografico');
    var layers    = wrapper.querySelectorAll('.layer');
    var tooltip   = document.getElementById('tooltip');
    var ttTitle   = document.getElementById('tooltip-title');
    var ttList    = document.getElementById('tooltip-list');

    function applyScale() {
      var scale = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
      var left  = Math.round((window.innerWidth - 1920 * scale) / 2);
      wrapper.style.transform  = 'scale(' + scale + ')';
      wrapper.style.marginLeft = left + 'px';
      container.style.height   = Math.round(1080 * scale) + 'px';
    }
    window.addEventListener('resize', applyScale);
    applyScale();

    function animateIn() {
      layers.forEach(function (layer) {
        var delay = parseInt(layer.dataset.delay || 0, 10) + 200;
        setTimeout(function () { layer.classList.add('visible'); }, delay);
      });
    }
    if (document.readyState === 'complete') {
      setTimeout(animateIn, 80);
    } else {
      window.addEventListener('load', function () { setTimeout(animateIn, 80); });
    }

    wrapper.querySelectorAll('.hotspot').forEach(function (hs) {
      hs.addEventListener('mouseenter', function () {
        var rect = hs.getBoundingClientRect();

        ttTitle.innerHTML = hs.dataset.title;
        ttList.innerHTML  = '';
        hs.dataset.items.split('|').forEach(function (item) {
          var li = document.createElement('li');
          li.textContent = item;
          ttList.appendChild(li);
        });

        tooltip.classList.add('visible');

        var cx    = rect.left + rect.width / 2;
        var midY  = rect.top + rect.height * 0.45;
        var ttH   = tooltip.offsetHeight;
        var ttW   = tooltip.offsetWidth;
        var above = midY - ttH - 14;
        var below = midY + 14;
        var top   = above >= 8 ? above : below;

        tooltip.dataset.dir = above >= 8 ? 'above' : 'below';

        var left = cx - ttW / 2;
        left = Math.max(8, Math.min(left, window.innerWidth - ttW - 8));

        tooltip.style.left = left + 'px';
        tooltip.style.top  = top  + 'px';
      });

      hs.addEventListener('mouseleave', function () {
        tooltip.classList.remove('visible');
      });
    });
  })();

  // Nav select
  (function () {
    var sel = document.getElementById('infog-select');
    var path = window.location.pathname.replace(/\/?$/, '/');
    for (var i = 0; i < sel.options.length; i++) {
      if (sel.options[i].value === path) { sel.selectedIndex = i; break; }
    }
    sel.addEventListener('change', function () { window.location.href = sel.value; });
  })();
</script>

</body>
</html>
