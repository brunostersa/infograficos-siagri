<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agroindústria</title>
  <style>
    :root {
      --green: #00b232;
      --lime:  #a5c715;
      --text:  #2a2b2b;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { background: #f5f5f5; overflow: hidden; height: 100%; }

    #scale-container { width: 100%; overflow: hidden; }

    #infografico {
      position: relative;
      width: 1920px;
      height: 1080px;
      background: #f5f5f5;
      transform-origin: top left;
    }

    /* ── Camadas ── */
    .layer {
      position: absolute;
      pointer-events: none;
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 0.55s ease-out, transform 0.55s ease-out;
    }
    .layer.visible { opacity: 1; transform: translateY(0); }
    .layer img { display: block; width: 100%; height: 100%; }

    /* bg-lines: reveal radial do centro para fora */
    .layer[data-id="bg"] {
      left: 495px; top: 326px; width: 983px; height: 519px;
      transform: none;
      clip-path: circle(0% at 50% 50%);
      transition: opacity 0.4s ease-out, clip-path 0.9s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .layer[data-id="bg"].visible {
      transform: none;
      clip-path: circle(150% at 50% 50%);
    }

    /* Coordenadas absolutas Figma 1920×1080 */
    .layer[data-id="geracao-de-demanda"]    { left: 480px;  top:  50px; width: 631px; height: 387px; }
    .layer[data-id="transformacao"]         { left: 780px;  top: 163px; width: 656px; height: 400px; }
    .layer[data-id="logistica"]             { left: 1102px; top: 392px; width: 492px; height: 309px; }
    .layer[data-id="controle-materia-prima"]{ left: 174px;  top: 483px; width: 621px; height: 229px; }
    .layer[data-id="qualidade"]             { left: 590px;  top: 598px; width: 506px; height: 346px; }
    .layer[data-id="venda-distribuicao"]    { left: 1154px; top: 644px; width: 643px; height: 386px; }

    /* ── Hotspots ── */
    .hotspot {
      position: absolute;
      cursor: pointer;
      border-radius: 8px;
      z-index: 20;
    }

    .hotspot[data-id="geracao-de-demanda"]    { left: 480px;  top:  50px; width: 631px; height: 387px; }
    .hotspot[data-id="transformacao"]         { left: 780px;  top: 163px; width: 656px; height: 400px; }
    .hotspot[data-id="logistica"]             { left: 1102px; top: 392px; width: 492px; height: 309px; }
    .hotspot[data-id="controle-materia-prima"]{ left: 174px;  top: 483px; width: 621px; height: 229px; }
    .hotspot[data-id="qualidade"]             { left: 590px;  top: 598px; width: 506px; height: 346px; }
    .hotspot[data-id="venda-distribuicao"]    { left: 1154px; top: 644px; width: 643px; height: 386px; }

    .hotspot::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 8px;
      background: rgba(0, 178, 50, 0);
      transition: background 0.25s ease;
    }
    .hotspot:hover::before { background: rgba(0, 178, 50, 0.08); }

    /* ── Tooltip global ── */
    #tooltip {
      position: fixed;
      background: #fff;
      border-left: 4px solid var(--green);
      border-radius: 8px;
      box-shadow: 0 8px 32px rgba(0,0,0,.18);
      padding: 16px 20px;
      width: 240px;
      pointer-events: none;
      opacity: 0;
      transform: translateY(6px);
      transition: opacity 0.2s ease, transform 0.2s ease;
      z-index: 1000;
    }
    #tooltip.visible { opacity: 1; transform: translateY(0); }
    #tooltip::after {
      content: '';
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      border: 8px solid transparent;
    }
    #tooltip[data-dir="above"]::after, #tooltip:not([data-dir])::after {
      top: 100%;
      border-top-color: #fff;
    }
    #tooltip[data-dir="below"]::after {
      bottom: 100%;
      border-bottom-color: #fff;
    }
    #tooltip h4 {
      font-family: 'Halcom', 'Arial Black', 'Arial Bold', sans-serif;
      font-weight: 900;
      font-size: 13px;
      color: var(--green);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 10px;
      line-height: 1.3;
    }
    #tooltip ul { list-style: none; padding: 0; }
    #tooltip ul li {
      font-family: 'Halcom', Arial, sans-serif;
      font-size: 12px;
      color: var(--text);
      line-height: 1.5;
      padding: 4px 0 4px 14px;
      position: relative;
      border-bottom: 1px solid rgba(0,0,0,0.06);
    }
    #tooltip ul li:last-child { border-bottom: none; }
    #tooltip ul li::before {
      content: '';
      position: absolute;
      left: 0; top: 50%;
      transform: translateY(-50%);
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--lime);
    }

    /* ── Nav flutuante ── */
    #infog-nav {
      position: fixed;
      top: 14px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;
      background: #fff;
      border: 1.5px solid #e0e0e0;
      border-radius: 8px;
      box-shadow: 0 4px 16px rgba(0,0,0,.12);
      padding: 6px 12px 6px 10px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: 'Halcom', Arial, sans-serif;
      font-size: 12px;
      color: #2a2b2b;
    }
    #infog-nav::before {
      content: '';
      display: inline-block;
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #00b232;
      flex-shrink: 0;
    }
    #infog-nav select {
      border: none;
      outline: none;
      font-family: inherit;
      font-size: 12px;
      font-weight: 700;
      color: #2a2b2b;
      background: transparent;
      cursor: pointer;
      padding-right: 4px;
    }

    /* ── Versão mobile (cards do Figma, 360px de largura) ── */
    #mobile-view { display: none; }
    @media (max-width: 767px) {
      html, body { overflow: auto; height: auto; scrollbar-width: none; }
      html::-webkit-scrollbar, body::-webkit-scrollbar { display: none; }
      #scale-container, #tooltip { display: none; }
      #mobile-view {
        --u: calc(min(100vw, 480px) / 360);
        display: block;
        width: min(100vw, 480px);
        margin: 0 auto;
        padding: 52px 0 24px;
      }
      body.no-nav #mobile-view { padding-top: 0; }
      .m-card {
        position: relative;
        opacity: 0;
        transform: translateY(16px);
        transition: opacity 0.5s ease-out, transform 0.5s ease-out;
      }
      .m-card.visible { opacity: 1; transform: none; }
      .m-card img { display: block; width: 100%; height: auto; }
      .m-card[data-ref] { cursor: pointer; -webkit-tap-highlight-color: transparent; }
      .m-card[data-ref]::after {
        content: '+';
        position: absolute;
        left: calc(var(--u) * 318);
        top: calc(var(--u) * (var(--rb) - 12));
        width: calc(var(--u) * 24);
        height: calc(var(--u) * 24);
        border-radius: 50%;
        background: #fff;
        color: var(--green);
        font: 700 calc(var(--u) * 18)/calc(var(--u) * 24) Arial, sans-serif;
        text-align: center;
        box-shadow: 0 2px 8px rgba(0,0,0,.18);
        transition: transform 0.25s ease;
      }
      .m-card.open::after { transform: rotate(45deg); }
      .m-panel {
        margin: 0 calc(var(--u) * 30);
        max-height: 0;
        overflow: hidden;
        background: #fff;
        border-left: 4px solid var(--green);
        box-shadow: 0 8px 24px rgba(0,0,0,.10);
        transition: max-height 0.3s ease, margin 0.3s ease;
      }
      .m-card.open + .m-panel {
        margin-top: calc(var(--u) * (var(--rb) - var(--h)));
        margin-bottom: calc(var(--u) * (var(--h) - var(--rb)));
      }
      .m-panel ul { list-style: none; padding: 10px 18px 12px; }
      .m-panel li {
        font-family: 'Halcom', Arial, sans-serif;
        font-size: 14px;
        color: var(--text);
        line-height: 1.4;
        padding: 6px 0 6px 16px;
        position: relative;
        border-bottom: 1px solid rgba(0,0,0,0.06);
      }
      .m-panel li:last-child { border-bottom: none; }
      .m-panel li::before {
        content: '';
        position: absolute;
        left: 0; top: 50%;
        transform: translateY(-50%);
        width: 6px; height: 6px;
        border-radius: 50%;
        background: var(--lime);
      }
    }
  </style>
</head>
<body>

<div id="infog-nav">
  <select id="infog-select" autocomplete="off">
    <option value="/distribuidor-de-insumos/">Distribuidor de Insumos</option>
    <option value="/loja-agropecuaria/">Loja Agropecuária</option>
    <option value="/originacao-comercio-de-graos/">Armazéns Gerais</option>
    <option value="/agroindustria/">Agroindústria</option>
    <option value="/produtor-rural/">Produtor Rural</option>
  </select>
</div>

<div id="tooltip">
  <h4 id="tooltip-title"></h4>
  <ul id="tooltip-list"></ul>
</div>

<div id="scale-container">
<div id="infografico">

  <div class="layer" data-id="bg" data-delay="1000"><img src="bg-lines.png" alt=""></div>

  <div class="layer" data-id="geracao-de-demanda"     data-delay="0"><img src="geracao-de-demanda.png" alt=""></div>
  <div class="layer" data-id="transformacao"          data-delay="200"><img src="transformacao.png" alt=""></div>
  <div class="layer" data-id="logistica"              data-delay="400"><img src="logistica.png" alt=""></div>
  <div class="layer" data-id="controle-materia-prima" data-delay="400"><img src="controle-materia-prima.png" alt=""></div>
  <div class="layer" data-id="qualidade"              data-delay="600"><img src="qualidade.png" alt=""></div>
  <div class="layer" data-id="venda-distribuicao"     data-delay="800"><img src="venda-distribuicao.png" alt=""></div>

  <!-- HOTSPOT: Geração de Demanda -->
  <div class="hotspot" data-id="geracao-de-demanda"
    data-title="Geração de Demanda"
    data-items="Controle de Estoque|Compras|Programação de Vendas">
  </div>

  <!-- HOTSPOT: Transformação -->
  <div class="hotspot" data-id="transformacao"
    data-title="Transformação"
    data-items="Boletim de Produção|Apuração de Perda|Entrada de Produto Acabado">
  </div>

  <!-- HOTSPOT: Logística -->
  <div class="hotspot" data-id="logistica"
    data-title="Logística"
    data-items="Gestão de Embalagens|Armazenamento|Transporte">
  </div>

  <!-- HOTSPOT: Controle de Matéria-Prima -->
  <div class="hotspot" data-id="controle-materia-prima"
    data-title="Controle de Matéria-Prima"
    data-items="Setup de Máquina|Separação|Programação de Fábrica">
  </div>

  <!-- HOTSPOT: Qualidade -->
  <div class="hotspot" data-id="qualidade"
    data-title="Qualidade"
    data-items="ISO 9000, 14000, 22000|Auditoria e Rastreabilidade">
  </div>

  <!-- HOTSPOT: Venda & Distribuição -->
  <div class="hotspot" data-id="venda-distribuicao"
    data-title="Venda &amp; Distribuição"
    data-items="Canais|Vendas|Controle de Entrega">
  </div>

</div>
</div>

<!-- ── MOBILE: cards empilhados (Figma "Infográfico - Mobile") ── -->
<div id="mobile-view">
  <div class="m-card" data-ref="geracao-de-demanda" style="--h:149;--rb:131"><img src="mobile/card-01.png" alt="Geração de Demanda e Planejamento"></div>
  <div class="m-card" data-ref="controle-materia-prima" style="--h:127;--rb:121"><img src="mobile/card-02.png" alt="Controle de Matéria-Prima"></div>
  <div class="m-card" data-ref="transformacao" style="--h:150;--rb:133"><img src="mobile/card-03.png" alt="Transformação"></div>
  <div class="m-card" data-ref="qualidade" style="--h:142;--rb:122"><img src="mobile/card-04.png" alt="Qualidade"></div>
  <div class="m-card" data-ref="logistica" style="--h:140;--rb:119"><img src="mobile/card-05.png" alt="Logística"></div>
  <div class="m-card" data-ref="venda-distribuicao" style="--h:136;--rb:118"><img src="mobile/card-06.png" alt="Venda e Distribuição"></div>
</div>

<script>
  (function () {
    var container = document.getElementById('scale-container');
    var wrapper   = document.getElementById('infografico');
    var layers    = wrapper.querySelectorAll('.layer');
    var tooltip   = document.getElementById('tooltip');
    var ttTitle   = document.getElementById('tooltip-title');
    var ttList    = document.getElementById('tooltip-list');

    function applyScale() {
      var scale = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
      var left  = Math.round((window.innerWidth - 1920 * scale) / 2);
      wrapper.style.transform  = 'scale(' + scale + ')';
      wrapper.style.marginLeft = left + 'px';
      container.style.height   = Math.round(1080 * scale) + 'px';
    }
    window.addEventListener('resize', applyScale);
    applyScale();

    function animateIn() {
      layers.forEach(function (layer) {
        var delay = parseInt(layer.dataset.delay || 0, 10) + 200;
        setTimeout(function () { layer.classList.add('visible'); }, delay);
      });
    }
    if (document.readyState === 'complete') {
      setTimeout(animateIn, 80);
    } else {
      window.addEventListener('load', function () { setTimeout(animateIn, 80); });
    }

    wrapper.querySelectorAll('.hotspot').forEach(function (hs) {
      hs.addEventListener('mouseenter', function () {
        var rect = hs.getBoundingClientRect();

        ttTitle.innerHTML = hs.dataset.title;
        ttList.innerHTML  = '';
        hs.dataset.items.split('|').forEach(function (item) {
          var li = document.createElement('li');
          li.textContent = item;
          ttList.appendChild(li);
        });

        tooltip.classList.add('visible');

        var cx    = rect.left + rect.width / 2;
        var midY  = rect.top + rect.height * 0.45;
        var ttH   = tooltip.offsetHeight;
        var ttW   = tooltip.offsetWidth;
        var above = midY - ttH - 14;
        var below = midY + 14;
        var top   = above >= 8 ? above : below;

        tooltip.dataset.dir = above >= 8 ? 'above' : 'below';

        var left = cx - ttW / 2;
        left = Math.max(8, Math.min(left, window.innerWidth - ttW - 8));

        tooltip.style.left = left + 'px';
        tooltip.style.top  = top  + 'px';
      });

      hs.addEventListener('mouseleave', function () {
        tooltip.classList.remove('visible');
      });
    });

    (function () {
    var sel = document.getElementById('infog-select');
    var path = window.location.pathname;
    for (var i = 0; i < sel.options.length; i++) {
      var folder = sel.options[i].value.replace(/\//g, '');
      if (path.indexOf('/' + folder + '/') !== -1) { sel.selectedIndex = i; break; }
    }
    sel.addEventListener('change', function () {
      var folder = sel.value.replace(/\//g, '');
      window.location.href = '../' + folder + '/';
    });
  })();
  })();

  // Oculta nav via ?nav=0
  if (new URLSearchParams(window.location.search).get('nav') === '0') {
    var nav = document.getElementById('infog-nav');
    if (nav) nav.style.display = 'none';
    document.body.classList.add('no-nav');
  }
</script>

<script>
  /* Versão mobile: anima os cards e abre a lista do hotspot correspondente ao tocar */
  (function () {
    var view = document.getElementById('mobile-view');
    if (!view) return;
    var cards = view.querySelectorAll('.m-card');
    cards.forEach(function (card, i) {
      setTimeout(function () { card.classList.add('visible'); }, 150 + i * 90);
      var ref = card.dataset.ref;
      var hs  = ref && document.querySelector('.hotspot[data-id="' + ref + '"]');
      if (!hs) { card.removeAttribute('data-ref'); return; }
      var panel = document.createElement('div');
      panel.className = 'm-panel';
      var ul = document.createElement('ul');
      hs.dataset.items.split('|').forEach(function (item) {
        var li = document.createElement('li');
        li.textContent = item;
        ul.appendChild(li);
      });
      panel.appendChild(ul);
      card.insertAdjacentElement('afterend', panel);
      card.setAttribute('role', 'button');
      card.setAttribute('aria-expanded', 'false');
      card.tabIndex = 0;
      function toggle() {
        var open = !card.classList.contains('open');
        card.classList.toggle('open', open);
        card.setAttribute('aria-expanded', open);
        panel.style.maxHeight = open ? panel.scrollHeight + 'px' : '0';
      }
      card.addEventListener('click', toggle);
      card.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); }
      });
    });

    /* Embed: informa a altura ao site pai para o iframe crescer sem barra de rolagem */
    if (window.parent !== window) {
      var mq = window.matchMedia('(max-width: 767px)');
      var last = 0;
      var postHeight = function () {
        var h = mq.matches ? Math.ceil(view.getBoundingClientRect().height) : 0;
        if (h === last) return;
        last = h;
        window.parent.postMessage({ type: 'siagri-infografico-altura', height: h }, '*');
      };
      if (window.ResizeObserver) new ResizeObserver(postHeight).observe(view);
      view.addEventListener('transitionend', postHeight);
      window.addEventListener('resize', postHeight);
      window.addEventListener('load', postHeight);
      postHeight();
    }
  })();
</script>

</body>
</html>
